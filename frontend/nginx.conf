# ============================================================
# nginx.conf — Configuración de Nginx para Educa AI
# ============================================================
# Nginx sirve los archivos estáticos compilados por Vite.
# La configuración clave es "try_files" que permite que React Router
# funcione correctamente: todas las rutas devuelven index.html
# y React se encarga de renderizar la página correcta.
# ============================================================

server {
    listen 80;
    # listen 80: Nginx escucha peticiones HTTP en el puerto 80 del contenedor.

    location / {
        # location /: aplica esta configuración a todas las rutas (/).

        root /usr/share/nginx/html;
        # root: directorio donde están los archivos estáticos compilados por Vite.

        index index.html;
        # index: archivo que se sirve cuando se accede a la raíz del sitio (/).

        try_files $uri $uri/ /index.html;
        # try_files: intenta servir el archivo de la URL en este orden:
        #   1. $uri       — busca el archivo exacto (ej: /assets/index.js).
        #   2. $uri/      — busca como directorio (ej: /assets/).
        #   3. /index.html — si no existe, devuelve index.html.
        # El paso 3 es CRÍTICO para React Router:
        # cuando el usuario visita /dashboard o /grupos/abc directamente,
        # Nginx no tiene esos archivos (no son archivos reales),
        # así que devuelve index.html y React Router maneja la ruta.
    }
}
